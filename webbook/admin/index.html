<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>남겨주신 한마디 관리 · 질문수업 웹북</title><link rel="stylesheet" href="/webbook/admin/admin.css?v=20261107-admin"></head><body><header><a href="/webbook/">← 질문수업 웹북</a><span>질문예술학교 · 관리자</span></header><main><h1>남겨주신 한마디</h1><p class="lead">응원과 강연 후기, 함께 나누고 싶은 질문을 확인합니다.</p><section id="login-panel" class="panel"><h2>관리자 로그인</h2><form id="admin-login"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><button id="login-button" disabled>로그인</button></form><p id="connection-status" role="status">서버 연결을 확인하고 있습니다.</p><p id="login-message" role="status" aria-live="polite"></p><p id="setup-link" hidden><a href="/webbook/setup-admin.html">관리자 기능 연결 안내 →</a></p></section><section id="records-panel" hidden><div class="session-bar"><span id="session-status"></span><button id="logout" class="secondary">로그아웃</button></div><div class="records-tools"><label for="visibility">공개 여부 <select id="visibility"><option value="all">전체</option><option value="public">공개</option><option value="private">비공개</option></select></label><button id="refresh" class="secondary">새로고침</button></div><p id="records-message" role="status" aria-live="polite"></p><div id="records"></div><button id="more" class="secondary" hidden>이전 소감 더 보기</button></section><aside class="notice"><strong>본문의 개인 메모에 관하여</strong><p>질문 기록지와 본문 메모는 독자 자신의 기기에만 저장됩니다. 서버로 전송하지 않으므로 관리자도 볼 수 없습니다. 이 화면에서는 ‘한마디 남기기’로 접수된 기록을 확인할 수 있습니다.</p></aside></main><footer>관리자 화면은 로그인한 동안에만 기록을 표시합니다. 로그인은 최대 20분 유지됩니다.</footer><script src="/webbook/config.js?v=20261107-admin"></script><script src="/webbook/admin/admin.js?v=20261107-hello" defer></script></body></html>
